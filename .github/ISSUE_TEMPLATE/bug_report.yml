name: Bug report
description: Something behaves differently from what is documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach real clinical documents.** If the bug only reproduces
        with one, say so and describe the shape of the document instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, and a synthetic document or IR fixture if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit SHA.
    validations:
      required: true
