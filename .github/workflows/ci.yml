name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  generated:
    name: Generated IG code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Downloads the pinned registry packages, verifies their checksums,
      # regenerates, and self-checks the IG's own examples against the output.
      - run: pnpm regen --target ndhm-6.5.0

      - name: Regenerating changes nothing
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::src/generated is stale or regen is not deterministic. Run pnpm regen and commit."
            exit 1
          fi

  cli-install:
    name: CLI works from a global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Pack each package exactly as it would be published, then install the
      # tarballs globally and run nuskha from a directory that is not the repo.
      - name: Pack and install globally
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for p in packages/core packages/ig packages/validate packages/compose apps/cli; do
            (cd "$p" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          npm install -g --no-audit --no-fund "$RUNNER_TEMP"/tarballs/*.tgz

      - name: Compile and validate outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/packages/compose/src/__fixtures__/prescriptions/19-six-medicines.ir.json" rx.json
          nuskha --version
          nuskha compile rx.json -o bundle.json
          nuskha validate --schema-only bundle.json
          if nuskha validate --schema-only rx.json; then
            echo "::error::an IR file passed bundle validation"
            exit 1
          fi

  validator:
    name: HL7 validator harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build downloads the pinned jar, checks its sha256, and warms the
      # package cache for ndhm.in#6.5.0. Expect several minutes cold.
      - name: Build the validator image
        run: docker build -t nuskha-validator packages/validate/docker

      - name: Validate the IG example, a broken bundle, and every composed fixture
        env:
          NUSKHA_VALIDATOR_IMAGE: nuskha-validator
        run: pnpm test packages/validate packages/compose

  preview:
    name: IG 7.0.0 preview is unchanged
    # The preview build is not immutable. NRCeS can republish it under the same
    # version, and when it does this job fails on the checksum. That is news to
    # act on, not a reason to block unrelated pull requests.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm regen

      - name: Regenerating changes nothing
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::No Signed-off-by: $(git show -s --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign your commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits signed off."
